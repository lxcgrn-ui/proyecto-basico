<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXCGRN-UI | Dashboard</title>
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #bc13fe;
            --bg: #0a0b10;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 背景動態光圈 */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.15) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            z-index: -1;
            filter: blur(50px);
        }

        /* 帥氣面板主體 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        h1 {
            margin: 10px 0;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            font-size: 0.8rem;
            border: 1px solid var(--primary);
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; box-shadow: 0 0 10px var(--primary); }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="glass-panel">
        <div class="avatar">🛸</div>
        <div class="status">SYSTEM ONLINE</div>
        <h1>LXCGRN UI</h1>
        <p style="color: #aaa; margin-bottom: 30px;">Cyber-Interface v1.0</p>
        
        <div class="links">
            <a href="#" class="btn">進入核心檔案</a>
            <a href="#" class="btn">聯絡開發者</a>
            <a href="https://github.com/lxcgrn-ui/hvyxz" class="btn" style="color: var(--primary);">查看原始碼</a>
        </div>
    </div>
</body>
</html>
